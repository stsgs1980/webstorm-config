name: CI

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # commitlint needs the base commit of a PR or the previous main tip.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Merge commits are exempt; a tag push has no branch range to lint.
      - name: Lint commit messages
        if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/')
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FROM="${{ github.event.pull_request.base.sha }}"
            TO="${{ github.event.pull_request.head.sha }}"
          else
            FROM="${{ github.event.before }}"
            TO="${{ github.sha }}"
            # No previous tip (new branch) or the previous tip was rebased
            # away (dependabot force-push): lint only what the branch adds
            # over the default branch, not the whole history.
            if [ "$FROM" = "0000000000000000000000000000000000000000" ] || ! git merge-base --is-ancestor "$FROM" "$TO"; then
              FROM="$(git merge-base "origin/${{ github.event.repository.default_branch }}" HEAD)"
            fi
          fi
          if [ "$FROM" = "$TO" ]; then
            npx --no-install commitlint --last --verbose
            exit 0
          fi
          npx --no-install commitlint --from "$FROM" --to "$TO" --verbose
      - run: npm run lint
      # Formatting rules must stay off: Prettier owns formatting in this repo.
      - run: npm run lint:prettier-conflicts
      # Advisory metrics: warnings are surfaced for review and never fail the
      # build (AGENTS.md §4.2). Thresholds live in scripts/lib/thresholds.ts.
      - run: npm run lint:metrics
      - run: npm run typecheck
      - run: npm run check:file-length
      - run: npm run check:docs
      - run: npm run check:templates
      - run: npm run check:style-consistency
      - run: npm run check:workspace-zones
      - run: npm run check:ide-state
      - run: npm run lint:css
      - run: npm run lint:md
      # Production dependencies only: dev-only advisories are accepted with a
      # documented mitigation in SECURITY.md, they do not ship to users.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run format:check

  floor:
    # Minimum from engines.node: proves install and toolchain on the floor.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.22.2"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:file-length
      - run: npm run check:docs
      - run: npm test

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  windows:
    # Windows is the primary developer platform: run the same CLI gate set as
    # the lint/test jobs, not a subset. The changelog job stays Linux-only
    # because it needs full history and tags.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:prettier-conflicts
      # Advisory metrics: warnings are surfaced for review and never fail the
      # build (AGENTS.md §4.2). Thresholds live in scripts/lib/thresholds.ts.
      - run: npm run lint:metrics
      - run: npm run typecheck
      - run: npm run lint:css
      - run: npm run lint:md
      - run: npm run format:check
      - run: npm run check:file-length
      - run: npm run check:docs
      - run: npm run check:templates
      - run: npm run check:style-consistency
      - run: npm run check:workspace-zones
      - run: npm run check:ide-state
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  changelog:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # The generator reads the version from the newest semver tag and
          # rewrites the whole file when no tag is visible, so fetch the tags.
          fetch-tags: true
      # A fork that deletes the file would leave the diff gate blind to the
      # untracked regenerated copy; require it in the index before generating.
      - run: git ls-files --error-unmatch CHANGELOG.md
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run changelog
      # chore/docs/ci commits need no entry (AGENTS.md #6); without the skip
      # a dependabot version bump fails the freshness gate.
      - name: Skip the entry gate for PRs without fix/feat/perf commits
        if: github.event_name == 'pull_request'
        run: |
          RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          if git log --format=%s "$RANGE" | grep -Eq '^(feat|fix|perf)(\([^)]*\))?!?:' \
            || git log --format=%B "$RANGE" | grep -q 'BREAKING CHANGE'; then
            echo "Entry-required commits found; the diff gate below applies."
          else
            echo "No fix/feat/perf/breaking commits; skipping the changelog diff gate."
            echo "SKIP_CHANGELOG_GATE=true" >> "$GITHUB_ENV"
          fi
      - run: git diff --exit-code CHANGELOG.md
        if: env.SKIP_CHANGELOG_GATE != 'true'
